plugins {
    id 'com.android.application' version '8.13.1'
}

android {
    namespace 'gr.eyecare.reminders'
    compileSdk 36

    defaultConfig {
        applicationId 'gr.eyecare.reminders'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
